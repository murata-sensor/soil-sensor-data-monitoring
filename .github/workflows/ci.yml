name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt
      - run: pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt
      - run: pip-audit
      - run: pytest
      - name: PII / forbidden-tokens check
        run: python -m scripts.check_no_pii

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=moderate
        working-directory: web
      - run: node --test gas/tests/security.test.cjs
      - run: npm run lint --if-present
        working-directory: web
      - run: npm test --if-present -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com"
          VITE_REGISTRY_SPREADSHEET_ID: "ci-placeholder"
          VITE_GAS_PROXY_URL: "https://example.invalid/exec"
          VITE_GAS_ADMIN_URL: "https://example.invalid/exec"
