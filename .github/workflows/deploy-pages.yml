name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_AUTH_PROVIDER:           ${{ vars.VITE_AUTH_PROVIDER || 'google' }}
          VITE_FIREBASE_API_KEY:        ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID:     ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN:    ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_GOOGLE_CLIENT_ID:        ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_REGISTRY_SPREADSHEET_ID: ${{ vars.VITE_REGISTRY_SPREADSHEET_ID }}
          VITE_GAS_PROXY_URL:           ${{ vars.VITE_GAS_PROXY_URL }}
          VITE_GAS_ADMIN_URL:           ${{ vars.VITE_GAS_ADMIN_URL }}
          VITE_BASE_PATH:               ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
