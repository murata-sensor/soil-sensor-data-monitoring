name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_GOOGLE_CLIENT_ID:        ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_REGISTRY_SPREADSHEET_ID: ${{ vars.VITE_REGISTRY_SPREADSHEET_ID }}
          VITE_GAS_PROXY_URL:           ${{ vars.VITE_GAS_PROXY_URL }}
          VITE_GAS_ADMIN_URL:           ${{ vars.VITE_GAS_ADMIN_URL }}
          VITE_BASE_PATH:               ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
